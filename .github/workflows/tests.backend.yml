name: Backend Tests (pytest)

on:
  workflow_dispatch:
  pull_request:

jobs:
  test-backend:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        # SQLite is the fast default. The Postgres leg is not redundant:
        # has_select_for_update is False on SQLite and the query compiler
        # silently drops the clause, so the row locking that every Profile
        # state transition is built on is only exercised here. Postgres is
        # also what the dev stack and most deployments actually run, and it is
        # the leg that replays migrations (see the --migrations flag below).
        database: [sqlite, postgres]

    # Declared at job level because GitHub Actions services cannot be
    # conditional on the matrix. The SQLite leg starts the container and
    # ignores it, which costs a few seconds and keeps the setup steps to a
    # single source of truth.
    services:
      postgres:
        image: postgres:14
        env:
          POSTGRES_DB: membermatters
          POSTGRES_USER: membermatters
          POSTGRES_PASSWORD: membermatters
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          # Matches the version the project is developed against.
          python-version: "3.12"
          cache: pip
          cache-dependency-path: memberportal/requirements-dev.txt

      # mysqlclient is in the runtime requirements and builds from source.
      - name: Install system dependencies
        run: sudo apt-get install -y default-libmysqlclient-dev pkg-config

      - name: Install Python dependencies
        run: pip install -r memberportal/requirements-dev.txt

      - name: Run tests
        working-directory: memberportal
        env:
          # membermatters.settings_test reads this to pick the backend; unset
          # (the sqlite leg) means an in-memory database.
          MM_TEST_DB: ${{ matrix.database == 'postgres' && 'postgres' || '' }}
          POSTGRES_HOST: 127.0.0.1
          POSTGRES_DB: membermatters
          POSTGRES_USER: membermatters
          POSTGRES_PASSWORD: membermatters
        # Coverage is reported, not gated. A percentage threshold this early
        # mostly buys padding tests.
        #
        # pytest.ini defaults to --no-migrations, which builds the schema from
        # the models and cuts the run roughly in half. The Postgres leg opts
        # back in so migrations are still replayed end-to-end on exactly one
        # leg — that is also the only place profile/0022's raw-SQL
        # LOWER(screen_name) index survives, since SQLite's table rebuild
        # drops it regardless.
        run: pytest ${{ matrix.database == 'postgres' && '--migrations' || '' }} --cov=. --cov-report=xml --cov-report=term-missing

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.database }}
          path: memberportal/coverage.xml
          if-no-files-found: ignore
