name: Python Linter (Black)

on:
  workflow_dispatch:
  pull_request:

jobs:
  lint-backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-python@v3
        with:
          python-version: "3.12"
      # Same version as memberportal/requirements.txt, which the commit hook uses.
      - uses: psf/black@stable
        with:
          version: "25.1.0"
