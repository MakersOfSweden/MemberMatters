[pytest]
DJANGO_SETTINGS_MODULE = membermatters.settings_test
python_files = test_*.py
testpaths = membermatters access api_billing api_general profile tests

# django-constance auto-registers its pytest plugin through an entry point, so
# the @pytest.mark.override_config marker is available without loading it here
# (an explicit -p constance.test.pytest is in fact a double-registration
# error). That marker is how tests drive the runtime-configurable flags the
# membership state machine branches on — ENABLE_STRIPE_MEMBERSHIP_PAYMENTS,
# REQUIRE_ACCESS_CARD, MAX_INDUCTION_DAYS, ...
addopts = -ra --strict-markers

markers =
    slow: long-running; excluded from the default CI leg
