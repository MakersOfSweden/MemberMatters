[pytest]
DJANGO_SETTINGS_MODULE = membermatters.settings_test
python_files = test_*.py
testpaths = membermatters access api_admin_tools api_billing api_general profile tests

# django-constance auto-registers its pytest plugin through an entry point, so
# the @pytest.mark.override_config marker is available without loading it here
# (an explicit -p constance.test.pytest is in fact a double-registration
# error). That marker is how tests drive the runtime-configurable flags the
# membership state machine branches on — ENABLE_STRIPE_MEMBERSHIP_PAYMENTS,
# REQUIRE_ACCESS_CARD, MAX_INDUCTION_DAYS, ...
#
# --no-migrations builds the schema straight from the models instead of
# replaying all 89 migrations, which is the single largest fixed cost in a
# run — a flat ~3s on both backends, paid before the first test executes.
# Nothing is lost on SQLite — the only migration-only DDL in the tree is the
# functional LOWER(screen_name) index in profile/0022, and a later AlterField
# already destroys it there via SQLite's table-rebuild (see test_migrations).
# The CI Postgres leg overrides this with --migrations, so migrations are
# still replayed end-to-end on exactly one leg.
addopts = -ra --strict-markers --no-migrations
